name: Run PHPUnit

on:
  push:
    branches:
      - develop
      - main
      - 3.x
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - '.wp-env.json'
      - '.github/workflows/integration.yml'
  pull_request:
    branches:
      - develop
      - main
      - 3.x
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpunit.xml.dist'
      - '.wp-env.json'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

# Cancel any existing runs of this workflow on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: WP ${{ matrix.wordpress }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        include:
          # Check lowest supported WP version, with the lowest supported PHP.
          - wordpress: '6.4'
            php: '8.2'
          # Check latest WP with the highest supported PHP.
          - wordpress: 'master'
            php: '8.5'
      fail-fast: false

    env:
      WP_ENV_CORE: WordPress/WordPress#${{ matrix.wordpress }}
      # Without this, both legs would run against the phpVersion pinned in
      # .wp-env.json and the matrix would only vary the PHP used on the host.
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Setup problem matchers for PHP
        run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"

      - name: Setup Problem Matchers for PHPUnit
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'

      - name: Install npm dependencies and start wp-env
        run: |
          npm -g install @wordpress/env
          wp-env start

      - name: Run integration tests (single site)
        run: composer test:integration

      - name: Run integration tests (multisite)
        run: composer test:integration-ms
